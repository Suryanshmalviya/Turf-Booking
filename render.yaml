# Render deployment blueprint for the API.
#
# The web frontend deploys separately on Vercel (vercel.json at the repo root):
#   - Vercel project env var: VITE_API_URL = https://<this-service>.onrender.com/api/v1
#     (build-time value; the client falls back to same-origin /api/v1 if unset)
#   - This service env var:  FRONTEND_URL = https://<your-app>.vercel.app
#     (CORS allows exactly one origin — it must match the Vercel origin)
# Split-origin cookie sessions are already configured below:
# AUTH_COOKIE_SECURE=true + AUTH_COOKIE_SAME_SITE=none, which the config schema
# validates in production.

services:
  # API Web Service (NOT a Static Site — this service runs Node, it does not
  # publish a static directory. Do not set a Publish Directory in the Render
  # dashboard; that field must stay empty for `type: web` services).
  - type: web
    name: pickleball-api
    env: node
    plan: free
    # `--include=dev` is mandatory: Render sets NODE_ENV=production, which makes
    # npm skip devDependencies by default — but the build below needs esbuild
    # (a devDependency). Runtime still only needs the bundled dist output.
    # `npm ci` (not `yarn install`) matches the committed package-lock.json;
    # the `packageManager: npm@11.6.0` pin in package.json keeps the version
    # stable. Manual dashboard Build Command overrides must match this line.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Required for cross-origin (Vercel web + Render API) cookie sessions.
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # CORS origin: set to the Vercel site origin (https://<app>.vercel.app).
      - key: FRONTEND_URL
        sync: false
