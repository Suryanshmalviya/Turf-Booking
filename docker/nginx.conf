# Rendered to /etc/nginx/conf.d/default.conf by the nginx entrypoint's envsubst
# pass at container start.
#
# Only the ${API_UPSTREAM_*} variables below are substituted (see
# NGINX_ENVSUBST_FILTER in docker/web.Dockerfile); every other `$name` is an
# nginx runtime variable and must be left alone.

upstream api_upstream {
    server ${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Container healthcheck target (also handy for uptime monitoring).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API: keeps cookies first-party and avoids CORS entirely.
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # The API applies its own throttling; do not also buffer slowly here.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history fallback: every other path is handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    # The API sets its own security headers; nginx must not duplicate or
    # override them on the proxied responses.
    proxy_hide_header X-Powered-By;
}
