name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      deploy:
        description: 'Actually deploy (otherwise build only)'
        required: false
        default: true
        type: boolean

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  verify:
    # Gate: CI must be green on the same commit before anything is published.
    name: Verify CI
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Assert CI succeeded for this commit
        uses: actions/github-script@v8
        with:
          script: |
            // CD and CI trigger at the same second on a push, so a completed CI
            // run for this commit may not exist yet. Poll until it completes
            // instead of failing immediately on a run still in progress.
            const sha = context.sha;
            const deadline = Date.now() + 45 * 60 * 1000;
            const pollMs = 30 * 1000;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                status: 'completed',
                per_page: 20,
              });
              const run = data.workflow_runs?.find(r => r.name === 'CI');
              if (run) {
                if (run.conclusion === 'success') {
                  core.info(`CI succeeded: ${run.html_url}`);
                } else {
                  core.setFailed(
                    `CI did not succeed for ${sha} (conclusion: ${run.conclusion}): ${run.html_url}`,
                  );
                }
                break;
              }
              if (Date.now() >= deadline) {
                core.setFailed(`Timed out waiting for CI to complete for ${sha}.`);
                break;
              }
              core.info('CI has not completed for this commit yet; waiting 30s...');
              await new Promise(resolve => setTimeout(resolve, pollMs));
            }

  build:
    name: Build & Publish Images
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN, not a personal token: short-lived and scoped to this repo.
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pickleball-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pickleball-api:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pickleball-web:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the image that was actually published, not a separate build.
      - name: Scan the published API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pickleball-api:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy
    needs: [build]
    # Protected environment: require reviewers for `production` under
    # Settings -> Environments before this can reach a live host.
    environment:
      name: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.environment)
            || (github.ref == 'refs/heads/main' && 'production')
            || 'staging' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Deployment key stored as a repository secret, never in the repo.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # The server holds .env.production, so secrets never travel through
          # this workflow or the git history.
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pickleball-api:${{ needs.build.outputs.version }}"
            export WEB_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pickleball-web:${{ needs.build.outputs.version }}"
            docker compose --env-file .env.production pull
            docker compose --env-file .env.production up -d --remove-orphans
            docker compose --env-file .env.production ps
          envs: API_IMAGE, WEB_IMAGE

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Roll back to the previous release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export API_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/pickleball-api:${PREVIOUS_TAG}"
            export WEB_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/pickleball-web:${PREVIOUS_TAG}"
            docker compose --env-file .env.production up -d
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          PREVIOUS_TAG: ${{ vars.PREVIOUS_DEPLOY_TAG }}
